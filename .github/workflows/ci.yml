name: Agent Guard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-hooks:
    name: Verify 0-Token Guard Hooks & Telemetry Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hook Regression Test Suite
        run: bash tests/test-hooks.sh
